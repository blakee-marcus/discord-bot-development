name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest]
        python-version: ['3.10', '3.11', '3.12', '3.13']
        include:
          - os: windows-latest
            python-version: '3.12'

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Lint
        run: ruff check .

      - name: Run tests
        run: pytest -q

      - name: Run public surface check
        run: python scripts/verify_public_surface.py

      - name: Build package
        run: python -m build

      - name: Smoke test built wheel
        run: |
          python -m venv /tmp/smoke-env
          /tmp/smoke-env/bin/pip install dist/*.whl
          /tmp/smoke-env/bin/discord-doctor --help
          /tmp/smoke-env/bin/discord-doctor --rules
        shell: bash

      - name: CLI sanity checks
        run: |
          echo "=== Checking broken fixtures (expect failures) ==="
          if discord-doctor tests/fixtures/js_broken; then
            echo "Expected js_broken to fail"
            exit 1
          fi
          if discord-doctor tests/fixtures/python_broken; then
            echo "Expected python_broken to fail"
            exit 1
          fi
          echo "=== Checking ok fixtures (expect pass) ==="
          discord-doctor tests/fixtures/js_ok
          discord-doctor tests/fixtures/python_ok
        shell: bash
